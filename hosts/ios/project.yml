# DSHHost — minimal iOS host embedding the M1 core dsh.
#
# The committed DSHHost.xcodeproj is generated from this file
# (hosts/ios/gen.sh) but is ALSO committed, so CI and fresh clones build
# without xcodegen. The pre-build phase re-runs Tools/gen_bundle_header.py
# whenever a runtime/dsh JS input changes, keeping the embedded bundle
# byte-identical to the checkout. quickjs-ng sources come from
# external/quickjs-ng/0.17.0 — materialize them first with
# external/ensure.sh.
name: DSHHost
options:
  bundleIdPrefix: io.github.lixiang9716
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/../../src"
      - "$(SRCROOT)/../../external/quickjs-ng/0.17.0"
      # The wasm3 interpreter's own headers (dsh_wasm.c includes them by
      # quoted name from a different directory than the vendored sources).
      - "$(SRCROOT)/../../external/wasm3/0.9.0/source"
      # zstd headers (dsh_runtime_host.c intrinsics include them)
      - "$(SRCROOT)/../../external/zstd/1.5.7"
      - "$(SRCROOT)/../../external/zstd/1.5.7/common"
      - "$(SRCROOT)/App/Generated"
    # zstd's x86_64 fast loop lives in huf_decompress_amd64.S, which the pin
    # does not carry: an x86_64 slice (Intel-Mac simulator) would hit undefined
    # HUF_*_fast_asm_loop symbols at link. ZSTD_DISABLE_ASM is zstd's own
    # switch — same define the android/harmony CMake and the CLI build pass.
    # Expressed per-config so the Debug default (DEBUG=1) survives intact.
    configs:
      Debug:
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "DEBUG=1", "ZSTD_DISABLE_ASM=1", "DSH_WITH_SQLITE=1"]
      Release:
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "ZSTD_DISABLE_ASM=1", "DSH_WITH_SQLITE=1"]

targets:
  DSHHost:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../../src/dsh_runtime_host.c
      # dsh_socket.c — the loopback socket seam's pump table (contract
      # v1.8.0): dsh_runtime_host.c references dsh_socket_poll/close_all
      # unconditionally, so leaving it out is a link error, not a
      # negotiation (the gateway still decides what gets SERVED).
      - path: ../../src/dsh_socket.c
      - path: ../../external/quickjs-ng/0.17.0/dtoa.c
      - path: ../../external/quickjs-ng/0.17.0/libregexp.c
      - path: ../../external/quickjs-ng/0.17.0/libunicode.c
      - path: ../../external/quickjs-ng/0.17.0/quickjs.c
      # The WebAssembly interpreter (contract v1.2.0 `wasmRun`): vendored +
      # sha256-pinned by external/ensure-wasm3.sh, compiled from
      # the same vendor tree the quickjs sources come from. Only the core is
      # linked; the WASI backends stay out (the app's boundary is our own
      # imported functions, not WASI's descriptor table).
      - path: ../../external/wasm3/0.9.0/source/m3_core.c
      # zstd 1.5.7 (BSD-3, single-thread) — the node:zlib zstd face, pinned by
      # external/ensure-zstd.sh
      - path: ../../external/zstd/1.5.7/common/debug.c
      - path: ../../external/zstd/1.5.7/common/entropy_common.c
      - path: ../../external/zstd/1.5.7/common/error_private.c
      - path: ../../external/zstd/1.5.7/common/fse_decompress.c
      - path: ../../external/zstd/1.5.7/common/pool.c
      - path: ../../external/zstd/1.5.7/common/threading.c
      - path: ../../external/zstd/1.5.7/common/xxhash.c
      - path: ../../external/zstd/1.5.7/common/zstd_common.c
      - path: ../../external/zstd/1.5.7/compress/fse_compress.c
      - path: ../../external/zstd/1.5.7/compress/hist.c
      - path: ../../external/zstd/1.5.7/compress/huf_compress.c
      - path: ../../external/zstd/1.5.7/compress/zstd_compress.c
      - path: ../../external/zstd/1.5.7/compress/zstd_compress_literals.c
      - path: ../../external/zstd/1.5.7/compress/zstd_compress_sequences.c
      - path: ../../external/zstd/1.5.7/compress/zstd_compress_superblock.c
      - path: ../../external/zstd/1.5.7/compress/zstd_double_fast.c
      - path: ../../external/zstd/1.5.7/compress/zstd_fast.c
      - path: ../../external/zstd/1.5.7/compress/zstd_lazy.c
      - path: ../../external/zstd/1.5.7/compress/zstd_ldm.c
      - path: ../../external/zstd/1.5.7/compress/zstd_opt.c
      - path: ../../external/zstd/1.5.7/compress/zstd_preSplit.c
      - path: ../../external/zstd/1.5.7/decompress/huf_decompress.c
      - path: ../../external/zstd/1.5.7/decompress/zstd_ddict.c
      - path: ../../external/zstd/1.5.7/decompress/zstd_decompress.c
      - path: ../../external/zstd/1.5.7/decompress/zstd_decompress_block.c
      - path: ../../external/wasm3/0.9.0/source/m3_env.c
      - path: ../../external/wasm3/0.9.0/source/m3_parse.c
      - path: ../../external/wasm3/0.9.0/source/m3_compile.c
      - path: ../../external/wasm3/0.9.0/source/m3_code.c
      - path: ../../external/wasm3/0.9.0/source/m3_module.c
      - path: ../../external/wasm3/0.9.0/source/m3_function.c
      - path: ../../external/wasm3/0.9.0/source/m3_bind.c
      - path: ../../external/wasm3/0.9.0/source/m3_info.c
      - path: ../../external/wasm3/0.9.0/source/m3_exec.c
      - path: ../../external/wasm3/0.9.0/source/m3_validate.c
      - path: ../../src/dsh_wasm.c
    preBuildScripts:
      - name: GenerateSpikeBundle
        script: |
          python3 "$SRCROOT/Tools/gen_bundle_header.py"
        inputFiles:
          - Tools/gen_bundle_header.py
          - ../../runtime/dsh/logger.js
          - ../../runtime/dsh/gateway.js
          - ../../runtime/dsh/registry.js
          - ../../runtime/dsh/manifest.json
          - ../../runtime/dsh/scenario/boot-verification.js
          - ../../runtime/dsh/scenario/gateway-binding.js
          - ../../runtime/dsh/scenario/device-plane.js
          - ../../runtime/dsh/scenario/gateway-bridge-smoke.js
          - ../../runtime/dsh/scenario/session-mock-llm.js
          - ../../runtime/dsh/scenario/carrier-loopback.js
          - ../../runtime/dsh/web-live/session-web-live.js
          - ../../runtime/dsh/upstream/web-write.js
          - ../../runtime/dsh/upstream/web-write-streams.js
          - ../../runtime/dsh/upstream/web-write-settings.js
          - ../../runtime/dsh/web-live/composer-web-live.js
          - ../../runtime/dsh/web/index.html
          - ../../runtime/dsh/web/carrier-page.js
          - ../../runtime/dsh/llm.js
          - ../../runtime/dsh/scenario/llm-live-stream.js
          - ../../external/dsh/util-crypto@0.1.6-alpha.2/lib/index.js
          - ../../system-plugins/dsh-fs/manifest.json
          - ../../system-plugins/dsh-fs/index.js
          - ../../system-plugins/dsh-subprocess-quickjs/manifest.json
          - ../../system-plugins/dsh-subprocess-quickjs/index.js
          - ../../system-plugins/dsh-ui/manifest.json
          - ../../system-plugins/dsh-ui/index.js
          - ../../presentation/web-client/manifest.json
          - ../../presentation/web-client/web/index.html
          - ../../presentation/web-client/web/main.js
        outputFiles:
          - App/Generated/SpikeBundle.h
          - App/Generated/SpikeBundle.c
      # This phase was previously only in the COMMITTED pbxproj, not here — so
      # `gen.sh` would have silently dropped it, and a regenerated project would
      # have shipped a Release build with no embedded official web client (the
      # release workflow's dist assertion catches that downstream, but only
      # after a failing build). Declaring it here makes the generator the single
      # source for it, and `basedOnDependencyAnalysis: false` states what the
      # phase already does — run every build — which is also what silences
      # Xcode's "will be run during every build because it does not specify any
      # outputs" warning. It must run every build: it fails loud on a missing
      # Release tree or a copied byte that drifts, which only holds if it runs.
      - name: StageOfficialWeb
        basedOnDependencyAnalysis: false
        script: |
          # Release only: embed the vendored official Web Client (dist + client
          # bundles) so a plain launch reaches the official UI with nothing
          # staged from outside. Debug is a no-op (the harness stages Documents
          # itself, and the E2E evidence must keep reading exactly the tree it
          # stages). The script fails loud when a Release source tree is missing
          # or a copied byte drifts.
          set -e
          python3 "$SRCROOT/Tools/stage_official_web.py" "$CONFIGURATION" \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: def
        CFBundleShortVersionString: "0.0.3"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The capability plane's camera family (v1.10.0): without this key the
        # OS kills the app at the first requestAccess — the declaration lives
        # HERE (the xcodegen generation source), not in the generated
        # App/Info.plist, or every `gen.sh` silently drops it.
        NSCameraUsageDescription: The camera capture burst (cameraCapture) lands the frames you shoot into the session's capture scope.
        # The capability plane's microphone face (v1.10.0): the same rule —
        # the first mic request TCC-kills the app without this key.
        NSMicrophoneUsageDescription: def records audio only while an agent session you started is using the microphone.
        # The picker E2E grants a scope into the app's Documents directory;
        # both flags keep that directory visible/browsable in Files.app so
        # the granted files can be inspected from the simulator UI.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lixiang9716.def
        SWIFT_OBJC_BRIDGING_HEADER: App/Source/Bridge.h
        TARGETED_DEVICE_FAMILY: "1"
        # Historical: the removed iSH engine was aarch64-only (hand-written
        # aarch64 assembly, aarch64 guest), which made an x86_64 simulator
        # slice unlinkable. The exclusion outlives the engine as the recorded
        # status quo — re-enabling the x86_64 slice is untested here and
        # belongs to its own change.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        # sqlite3: a system library on iOS, hence no path for it. It backs the
        # node:sqlite seam (dsh_runtime_host.c's DSH_WITH_SQLITE face). The
        # engine's static libs (-ldsh_ish -lishcore) and their own deps
        # (-lz -lresolv, "used by nothing else in the link" per src/build.sh's
        # --no-ish branch) retired with iSH.
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lsqlite3"
      # The Release log-strip flag (AGENTS.md constraint 5 / rules.md rule L4).
      # It lived ONLY in the committed pbxproj, so regenerating the project
      # silently dropped it and the strip became cosmetic — a release build with
      # full logging. `dev/ios` builds Debug and cannot see that; the `logging`
      # gate's L4c reads the pbxproj and caught it on the regeneration.
      configs:
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DSH_RELEASE
