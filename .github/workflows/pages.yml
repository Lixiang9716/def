name: pages/demo
# GitHub Pages: the landing page for def — the app you define. The page is
# a PURE STATIC single page: the lynx-view client mount was removed by
# owner decision (2026-10-16, correction 3), so the former install ->
# build:web -> pin web-core chain is gone and staging copies only the
# page plus its self-hosted display face. staging is demo/stage-pages.sh —
# the same script verified locally is what deploys.
#
# HISTORY (for anyone archaeology-ing the bundle out of this file): the
# page used to mount the real ReactLynx client render (the #248 acceptance
# probe productized: npm ci -> npm run build:web -> dist-web/main.web.bundle
# mounted by <lynx-view> via @lynx-js/web-core's static client). The mount
# left the landing on 2026-10-16; the client's demo home is the repo, not
# this page.
#
# Job split (measured 2026-10-15, after Pages was enabled): the job declaring
# `environment: github-pages` becomes a DEPLOYMENT REQUEST at job start, and
# the github-pages environment's branch protection rejects PR merge refs —
# the whole PR leg died in 2s before any step. So the chain is split the
# canonical way: `build` stages the artifact for every event with no
# environment; `deploy` (main/dispatch only) owns the environment and the
# three Pages steps.
#
# KNOWN FIRST-RUN FAILURE (historical): GitHub Pages was OFF until the owner
# flipped Settings -> Pages -> Build and deployment -> Source: "GitHub
# Actions" (done 2026-10-15). Until then configure-pages/deploy-pages failed
# ("Pages not enabled") — expected and documented, not a workflow defect.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "presentation/lynx-client/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "presentation/lynx-client/**"
      - ".github/workflows/pages.yml"

# Deploy legs (push/dispatch) share the official single-flight "pages" group:
# one deployment at a time, never cancelling an in-progress production deploy.
# pull_request legs get their own per-PR group where superseded runs cancel —
# a PR validation run is disposable, a production deploy is not.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: pages-demo (build & validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Stage the Pages artifact (same script locally and in CI)
        run: sh presentation/lynx-client/demo/stage-pages.sh "$GITHUB_WORKSPACE" pages-dist

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

  deploy:
    name: pages-demo (deploy)
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The three Pages steps are deploy-only: on pull_request the leg proves
      # the stage chain and stops — no deployment is created, nothing touches
      # the (owner-gated) Pages integration.
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
