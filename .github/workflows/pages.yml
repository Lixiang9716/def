name: pages/demo
# GitHub Pages: the ONLINE DEMO of the lynx-client web render — what the
# product looks like, for early reviewers, before any install.
#
# The recipe is the #248 acceptance probe, productized:
#   npm ci (committed lockfile) -> npm run build:web -> dist-web/main.web.bundle,
#   mounted by <lynx-view> on a static landing page via @lynx-js/web-core's
#   static client (the package README's official recipe: client.js +
#   client.css + <lynx-view url=...>). staging is demo/stage-pages.sh — the
#   same script verified locally is what deploys.
#
# The web runtime (@lynx-js/web-core) is a BUILD-TIME-ONLY pin: installed into
# a scratch prefix and copied verbatim into the artifact; it never enters the
# product dependency set of presentation/lynx-client.
#
# Job split (measured 2026-10-15, after Pages was enabled): the job declaring
# `environment: github-pages` becomes a DEPLOYMENT REQUEST at job start, and
# the github-pages environment's branch protection rejects PR merge refs —
# the whole PR leg died in 2s before any step. So the chain is split the
# canonical way: `build` runs the full install->build->pin->stage chain for
# every event with no environment; `deploy` (main/dispatch only) owns the
# environment and the three Pages steps.
#
# KNOWN FIRST-RUN FAILURE (historical): GitHub Pages was OFF until the owner
# flipped Settings -> Pages -> Build and deployment -> Source: "GitHub
# Actions" (done 2026-10-15). Until then configure-pages/deploy-pages failed
# ("Pages not enabled") — expected and documented, not a workflow defect.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "presentation/lynx-client/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "presentation/lynx-client/**"
      - ".github/workflows/pages.yml"

# Deploy legs (push/dispatch) share the official single-flight "pages" group:
# one deployment at a time, never cancelling an in-progress production deploy.
# pull_request legs get their own per-PR group where superseded runs cancel —
# a PR validation run is disposable, a production deploy is not.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: pages-demo (build & validate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install the client bundle (pinned lockfile; npmmirror fallback)
        run: |
          npm ci --prefix presentation/lynx-client/bundle --no-fund --no-audit \
            || npm ci --prefix presentation/lynx-client/bundle --no-fund --no-audit \
                 --registry=https://registry.npmmirror.com

      - name: Build the web-target bundle
        run: npm run build:web --prefix presentation/lynx-client/bundle

      - name: Pin the Lynx web runtime (build-time only, never a product dep)
        run: |
          npm install --prefix .pages-runtime --no-fund --no-audit \
            @lynx-js/web-core@0.26.2 \
            || npm install --prefix .pages-runtime --no-fund --no-audit \
                 @lynx-js/web-core@0.26.2 --registry=https://registry.npmmirror.com
          test -f .pages-runtime/node_modules/@lynx-js/web-core/dist/client_prod/static/js/client.js \
            || { echo "::error::web-core static client missing after install"; exit 1; }

      - name: Stage the Pages artifact (same script locally and in CI)
        run: sh presentation/lynx-client/demo/stage-pages.sh "$GITHUB_WORKSPACE" pages-dist

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

  deploy:
    name: pages-demo (deploy)
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The three Pages steps are deploy-only: on pull_request the leg proves
      # the install->build->pin->stage chain and stops — no deployment is
      # created, nothing touches the (owner-gated) Pages integration.
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
