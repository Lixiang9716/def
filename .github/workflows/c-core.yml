name: c-core
# The C-host desktop CLI's Linux CI face — the sync+compile+test build over
# the vendored pins, then the ten log-verified test-core legs re-run over the
# fresh build with the report artifact uploaded even on red, then the
# shell-diff differential (test-hardening row 6): every cases.json script
# through the runner's real bash vs the dsh-shell-js executor.
#
# A second face, `sanitize`: the ten log-verified test-core legs — narrowed
# to the widest-coverage subset that fits this job's 60-minute bound under
# ASan (measured on ubuntu-24.04-arm across two runs: the client-driving
# legs — upstream-boot 51 min, settings-surfaces 40+ min unfinished — cannot
# fit; the subset and the exclusions are argued at the step) — driven by an
# asan+ubsan build of the same CLI (src/build.sh --sanitize). Any sanitizer
# report — memory error, undefined behavior, leak — exits nonzero, fails the
# leg (set -eu), and fails the job, with symbolized stacks (leak detection
# is Linux-only: ASAN_OPTIONS=detect_leaks=1 lives in this job's env because
# macOS ASan rejects it).
on:
  pull_request:
    paths:
      - 'src/**'
      - 'example/**'
      - '.github/workflows/c-core.yml'
      - 'build/build.sh'
      - 'external/ensure.sh'
      - 'external/ensure-dsh.sh'
      - 'runtime/dsh/ci/**'
      - 'runtime/dsh/upstream/**'
      - 'runtime/dsh/system-plugins/dsh-shell-js/**'
      - 'test/shell-diff/**'
      - 'contract/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'example/**'
      - '.github/workflows/c-core.yml'
      - 'build/build.sh'
      - 'external/ensure.sh'
      - 'external/ensure-dsh.sh'
      - 'runtime/dsh/ci/**'
      - 'runtime/dsh/upstream/**'
      - 'runtime/dsh/system-plugins/dsh-shell-js/**'
      - 'test/shell-diff/**'
      - 'contract/**'
  workflow_dispatch:
concurrency:
  group: c-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04-arm
    # 60 minutes bounds the COLD CLI build plus the ten log-verified legs
    # with wide headroom (the measured build is well under 15).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Cache the vendored trees
        # Same pattern as weekly-sweep/gov.yml: the vendored trees are
        # untracked by design (D6), materialized by sha256-pinned ensure
        # scripts, cached keyed on the pin tables themselves — a cache row
        # that outlives a pin change refetches exactly what moved; the cache
        # is an accelerator, never a source of truth.
        uses: actions/cache@v6
        with:
          path: |
            external/quickjs-ng
            external/zstd
            external/wasm3
            external/dsh
            external/npm
          key: c-core-${{ hashFiles('external/ensure.sh', 'external/ensure-dsh.sh') }}
      - name: Materialize the vendored trees
        # ensure.sh: engine + zstd + wasm3. ensure-dsh.sh: the runtime
        # closure the legs' boots serve.
        run: |
          external/ensure.sh
          external/ensure-dsh.sh
      - name: Build core
        # build = sync + compile + test: the compile leg produces the
        # build/dsh-cli (+ release flavor is NOT built here — the debug
        # default only), and its embedded test pass runs the ten legs.
        run: sh build/build.sh build core
      - name: Test core
        # The ten log-verified legs, standalone: re-run over the fresh
        # build so the report artifact below always follows a dedicated
        # suite pass (cheap — everything is compiled and vendored by now).
        run: sh build/build.sh test core
      - name: Shell diff harness (dsh-shell-js × real bash)
        # test-hardening row 6: every cases.json script through the runner's
        # real bash (Linux has it) and through the dsh-shell-js executor's
        # real ToolRuntime dispatch, normalized exit/stdout/stderr compared
        # per case expectation. Red = an unpinned difference = a dialect
        # bug; the report + divergence list ride the artifact upload below
        # even on red.
        run: sh test/shell-diff/run.sh
      - name: Upload the leg reports
        # The legs' own receipts (logs.txt / scenario.jsonl / verdict.json /
        # receipt.json under runtime/dsh/artifacts/, shell-diff's
        # report.json + divergences.md included) plus the raw logs-*.txt
        # the checkers diffed — the E2E evidence, uploaded even on red.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: c-core-reports
          path: |
            runtime/dsh/artifacts/
            runtime/dsh/logs-*.txt

  sanitize:
    # The memory-safety face: the ten legs, narrowed to the widest-coverage
    # subset that fits (measured across two runs: the client-driving legs —
    # upstream-boot 51 min, settings-surfaces 40+ min unfinished — blow the
    # 60-minute bound under ASan), over the asan+ubsan CLI flavor. The
    # flavor is opt-in — src/build.sh --sanitize writes dsh-cli-sanitize
    # BESIDE (never over) the default dsh-cli — so the core job's default
    # build is byte-identical and untouched. This job installs the sanitized
    # binary at the legs' expected build/dsh-cli path in its own ephemeral
    # workspace and lets any nonzero CLI exit (ASan error, UBSan abort via
    # -fno-sanitize-recover=all, LSan leak) fail the leg's set -eu script —
    # red means red, no sanitizer report can slip through.
    runs-on: ubuntu-24.04-arm
    # The kept five legs measured 15.8 min + 1.2 min build (~18 min job) —
    # wide headroom under this bound.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Cache the vendored trees
        # The SAME key as the core job: one cache row feeds both faces, and
        # actions/cache skips a duplicate save — no extra storage, no drift
        # between what the two faces compile against.
        uses: actions/cache@v6
        with:
          path: |
            external/quickjs-ng
            external/zstd
            external/wasm3
            external/dsh
            external/npm
          key: c-core-${{ hashFiles('external/ensure.sh', 'external/ensure-dsh.sh') }}
      - name: Materialize the vendored trees
        run: |
          external/ensure.sh
          external/ensure-dsh.sh
      - name: Build the sanitized CLI
        # -fsanitize=address,undefined -fno-sanitize-recover=all, -g
        # -fno-omit-frame-pointer for symbolized stacks, debug logging regime
        # (the legs assert on structured logs). Same sources, same pins.
        run: sh src/build.sh --sanitize
      - name: Run the sanitizer-subset legs under the sanitized CLI
        # doc/test-coverage.md row 2's documented fallback: the full ten
        # timed out on this runner under ASan, twice, with measured numbers
        # (runs 38760413938 and 38778823092): upstream-boot 51 min alone;
        # settings-surfaces 4 min of client-bundle build + 40 min of
        # scenario without finishing — both legs drive the built web client
        # through the sanitized pump, which is the pathology. The kept five
        # measured 15.8 min of legs + 1.2 min build (~18 min job, wide
        # headroom under the 60-minute bound): upstream-session (the
        # deepest turn path — llm streaming, tool calls, persistence),
        # seam-inventory (every product flag + composition plane + every
        # upstream-catalog service through the resolver — the widest single
        # sweep), shim-exposure-probe (the shim/globalThis face), office
        # (the binary-document path — zstd's heaviest workout), dsh-shell-js
        # (shell tool exec through the module loader). Out, and why:
        # upstream-boot and settings-surfaces (the two measured
        # client-driving outliers), open-design + plugin-forms (narrow
        # single-feature flows the five subsume), session-preset-join-node
        # (pure node — never loads the C host, nothing to sanitize). The
        # excluded legs ran clean under ASan in the local full-ten
        # validation (macOS); the gap is runner throughput, not findings.
        # Leak detection is a RUNTIME option, not a compile flag — and it is
        # LSan-on-Linux only (macOS ASan fails loud on detect_leaks), so it
        # lives in this job's env, never in src/build.sh. print_stacktrace
        # keeps every LSan/UBSan report carrying its stack.
        env:
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: print_stacktrace=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          cp runtime/dsh/build/dsh-cli-sanitize runtime/dsh/build/dsh-cli
          runtime/dsh/ci/run-upstream-e2e.sh
          runtime/dsh/ci/run-seam-inventory-e2e.sh
          runtime/dsh/ci/run-shim-exposure-probe.sh
          runtime/dsh/ci/run-office-e2e.sh
          runtime/dsh/ci/run-dsh-shell-js-e2e.sh
      - name: Upload the leg reports
        # The same artifact face as the core job; sanitizer reports go to the
        # leg stderr (the job log) and the leg logs, so a red run carries its
        # own evidence.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: c-core-sanitize-reports
          path: |
            runtime/dsh/artifacts/
            runtime/dsh/logs-*.txt
