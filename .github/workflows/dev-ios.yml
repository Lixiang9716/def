name: dev/ios
# End-to-end iOS pipeline. Since M1 this builds the dsh app in hosts/ios
# (quickjs-ng + dsh_spike_host.c) and, when the runner has a usable iOS
# simulator, runs BOTH dsh scenarios — boot.verification (runtime shim) and
# carrier.loopback (loopback static+WS carrier) — in one launch and
# verifies the canonical log lines with the shared checker
# (test/e2e/check.mjs) — logs are the verdict, screenshots are never
# asserted on (doc/ARCHITECTURE.md).
#
# Since the D9 flip (contract/proposals/2026-09-29-generated-bundles.md) the
# generated bytes — App/Generated/ and DSHHost.xcodeproj/ — are no longer
# committed: this workflow installs xcodegen and runs hosts/ios/gen.sh ahead
# of the build, so a fresh clone generates its own project (this pipeline is
# the flip's fresh-clone proof).
#
# Since M2 it also checks gateway.binding + the gateway audit stream
# (test/e2e/scenarios/gateway-*.json). HONEST LIMITATION: that scenario
# is UI-driven (permission alert, Files picker, approval dialog, notification
# banner) and hosted CI runners have no idb/UI driver, so the m2 leg cannot
# complete here — its step is continue-on-error and expected to skip/warn.
# The build is the hard gate; the FULL m2 E2E runs locally via
# test/e2e/run-ios.sh (see test/e2e/README.md).
#
# Manual trigger plus path-filtered pushes/PRs: macOS runner minutes bill at
# 10x, so docs-only changes never reach this pipeline.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "hosts/ios/**"
      - "contract/**"
      - "runtime/**"
      - "system-plugins/**"
      - "presentation/**"
      - "test/e2e/**"
      - ".github/workflows/dev-ios.yml"
  pull_request:
    paths:
      - "hosts/ios/**"
      - "contract/**"
      - "runtime/**"
      - "system-plugins/**"
      - "presentation/**"
      - "test/e2e/**"
      - ".github/workflows/dev-ios.yml"

# Superseded runs cancel here: a newer push's verdict is the branch's state, and
# an interleaved stale run answering late reads as a flake. The release
# pipelines deliberately do NOT cancel (see theirs) — and note this block is
# new: without it, two pushes in quick succession each kept a macOS runner and
# two ubuntu runners running to completion.
concurrency:
  group: dev-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-e2e:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Same unpacked-cache pattern as dev/harmonyos: xcodebuild uses
      # -derivedDataPath hosts/ios/DerivedData so incremental builds restore
      # from this cache (SwiftPM + module cache).
      - name: Cache DerivedData
        uses: actions/cache@v6
        with:
          path: hosts/ios/DerivedData
          # Keyed on the SOURCES, not a frozen literal. `dev-ios-deriveddata-v2`
          # was a static key: actions/cache writes it once and then never
          # refreshes it, so the cache was frozen at whatever first populated
          # it — measured, the app binary's UUID was byte-identical across three
          # consecutive runs. Keying on the sources rotates it when the app
          # changes, and the restore-keys prefix below still lands on the newest
          # previous cache, so an incremental build survives the rotation.
          #
          # Every pattern was checked to match TRACKED files at this step's
          # position in the job (29 under App/Source, 2 under Tools,
          # project.yml) — a glob that matches nothing makes hashFiles drop
          # that component, and a key over nothing is constant, a cache step
          # that silently never helps. App/Generated/** and the generated
          # project.pbxproj deliberately do NOT appear: since the D9 flip
          # (contract/proposals/2026-09-29-generated-bundles.md) both are
          # gitignored build output, absent from a fresh checkout until gen.sh
          # runs BELOW this step — keying on them was hashing air and made the
          # key blind to exactly nothing.
          key: dev-ios-deriveddata-${{ hashFiles('hosts/ios/App/Source/**', 'hosts/ios/Tools/**', 'hosts/ios/project.yml') }}
          # A static key with no fallback is written once and then never
          # refreshed — every later run restores the same frozen tree. The
          # prefix fallback lets a newer save land and be picked up, while the
          # primary key still pins the fast path.
          restore-keys: |
            dev-ios-deriveddata-

      - name: Toolchain sanity
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes | head -5

      # Materialize the pinned quickjs-ng engine sources (sha256-verified;
      # network only needed on first fetch). Must precede any build that
      # embeds the engine (runtime/dsh/README.md embedding contract).
      # ensure-dsh.sh materializes the pinned upstream DSH closure — the
      # GenerateSpikeBundle phase pins it at alpha.2 (gen_bundle_header.py),
      # so a build without it fails PhaseScriptExecution. That failure was
      # INVISIBLE here until the build step got `set -o pipefail` (the
      # `| tail -30` swallowed xcodebuild's exit status); this step is the
      # fix for the breakage that had been landing green since the D9 bump.
      - name: Prewarm the simulator (background)
        # The simulator's first boot does one-time runtime work (the dyld shared
        # cache among it) and on a hosted runner that can take minutes. Booting
        # it here, without waiting, lets that happen while the rest of the job
        # runs, instead of landing inside the E2E step where it is measured and
        # mistaken for a hang. Idempotent: the E2E step boots again and tolerates
        # "already booted".
        #
        # No continue-on-error: it already exits 0 with a warning when there is
        # no simulator to prewarm, so a non-zero exit here means something real
        # went wrong — and absorbing it would be another failure nobody sees.
        run: |
          set -euo pipefail
          # The SAME pinned preference list as the E2E step below, and that is
          # not cosmetic: the prewarm exists to warm the device the E2E will
          # use. Taking any iPhone here could warm a different one, in which
          # case the E2E pays the cold-boot cost the prewarm was meant to
          # remove — a silent no-op that looks like a working optimisation.
          # The any-iPhone fallback is the E2E step's own fallback, verbatim:
          # both steps run the same simctl list and take the same first match,
          # so they still agree on the device (measured 2026-09-23: a runner
          # image without any preferred name made the prewarm no-op while the
          # E2E booted a cold fallback device — the exact cost prewarm exists
          # to remove).
          UDID=""
          for want in "iPhone 16 Pro" "iPhone 17" "iPhone 16" "iPhone 15"; do
            UDID=$(xcrun simctl list devices available | grep -F "$want (" \
              | grep -m1 -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' || true)
            [ -n "$UDID" ] && break
          done
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep -iE 'iphone' \
              | grep -m1 -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' || true)
          fi
          if [ -z "$UDID" ]; then
            echo "::warning::no available iPhone simulator to prewarm"
            exit 0
          fi
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "prewarming $UDID (background — not waited on)"
          ( xcrun simctl boot "$UDID" >/dev/null 2>&1 || true ) &
          echo "prewarm dispatched"

      - name: Cache the vendored upstream closure
        # ensure.sh + ensure-dsh.sh re-download the pinned quickjs-ng / DSH
        # closure on every run, and six workflows do it — 29 s of it in dev/ios
        # alone. Keyed on the pin scripts, which ARE the tracked provenance
        # record (D6/D9), so a pin change rotates the key. Safe because they
        # re-verify sha256 over whatever lands: a restored tree is verified, not
        # trusted. Single-line key on purpose — a folded scalar can resolve to a
        # literal and give a cache that never hits.
        uses: actions/cache@v6
        with:
          path: |
            external/quickjs-ng
            external/dsh
            external/npm
          key: vendor-${{ runner.os }}-${{ hashFiles('external/ensure.sh', 'external/ensure-dsh.sh') }}

      - name: Vendor quickjs-ng + the pinned upstream DSH closure
        run: |
          set -euo pipefail
          external/ensure.sh
          external/ensure-dsh.sh

      # The upstream parity differential on the macOS CLI: the reference leg
      # under plain Node + the port leg inside quickjs, each against its OWN
      # mock instance (the script is one-shot; a shared instance let the
      # reference leg starve the port leg — the parked "body pump" failure
      # was that starvation, not the pump). The iOS-simulator port leg runs
      # LOCALLY via test/e2e/run-ios-upstream-parity.sh (CI runners cannot
      # drive a simulator app capture the way the local runner does).
      - name: "Upstream parity differential on the macOS CLI (reference + port legs)"
        run: sh runtime/dsh/ci/run-upstream-parity.sh
      # The D9 flip (contract/proposals/2026-09-29-generated-bundles.md): the
      # generated bytes stopped being committed — DSHHost.xcodeproj/ and
      # App/Generated/ are build output now. Generation is therefore the
      # build's job, HERE and at every consumer site: gen.sh runs the pinned
      # vendored sources through gen_bundle_header.py (the same script the
      # GenerateSpikeBundle pre-build phase runs) and regenerates the project
      # from project.yml. It must sit AFTER the vendor step above (xcodegen
      # references the quickjs/wasm3/zstd sources on disk) and BEFORE the first
      # xcodebuild (which needs the generated project to exist).
      - name: Install xcodegen
        run: |
          brew install xcodegen
          xcodegen --version
      - name: Generate the dsh bundle + Xcode project (gen.sh)
        run: sh hosts/ios/gen.sh
      - name: Build dsh app
        run: |
          set -o pipefail
          cd hosts/ios
          xcodebuild build \
            -project DSHHost.xcodeproj \
            -scheme DSHHost \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            | tail -30

      # Boot + install + launch + verify + classify. The mechanics live in
      # test/e2e/run-ios-boot-carrier.sh (one attempt per invocation, extracted
      # verbatim from the inline bash that used to sit here); the step is the
      # #515 attempt loop: at most ONE retry, ONLY on an environment-class
      # red (exit 3) — a product red (exit 1) is a regression no retry can
      # fix, and any green attempt ends the loop. This step GATES the
      # pipeline (the build above is real and always gates; a red here with
      # a green build is reported, never hidden — the verdicts, the
      # environment receipts and the logs are uploaded either way).
      #
      # Why the retry lives HERE and not in the script or the checker: the
      # script owns ONE attempt's mechanics; check.mjs must stay a pure
      # function (log in, verdict out) or selftest.sh's fixture proofs stop
      # proving anything. The in-step `for attempt` loop is the repo's
      # precedent (dev-harmonyos.yml's CLT download).
      #
      # Before a retry, attempt-1's whole artifact dirs move aside
      # (boot-carrier-*.attempt1/): every attempt of one workflow shares GITHUB_RUN_ID,
      # so a stale verdict left at the canonical path would pass the "Report
      # verdict" provenance check as if attempt 2 had produced it. If
      # attempt 2 goes green, the green IS the verdict and attempt-1's
      # environment receipt stays in the artifacts (the flake's evidence);
      # a twice-red step is red with both receipts attached — a reproduced
      # stall is a real problem, not a flake.
      - name: Run boot.verification + carrier.loopback on simulator and verify
        id: dsh-run
        run: |
          set -euo pipefail
          final_rc=0
          for attempt in 1 2; do
            rc=0
            sh test/e2e/run-ios-boot-carrier.sh "$attempt" || rc=$?
            if [ "$rc" -eq 0 ]; then
              final_rc=0
              break
            fi
            final_rc="$rc"
            if [ "$rc" -ne 3 ] || [ "$attempt" -eq 2 ]; then
              break
            fi
            echo "::warning::attempt 1 ended environment-class — preserving its verdicts/receipt under boot-carrier-*.attempt1/ and retrying ONCE"
            for d in boot-carrier-dsh boot-carrier-carrier; do
              rm -rf "hosts/ios/artifacts/$d.attempt1"
              mv "hosts/ios/artifacts/$d" "hosts/ios/artifacts/$d.attempt1"
            done
          done
          if [ "$final_rc" -eq 3 ]; then
            echo "::error::boot-carrier e2e ended ENVIRONMENT-class on BOTH attempts — receipts: hosts/ios/artifacts/boot-carrier-*/verdict-environment.json (+ boot-carrier-*.attempt1/). The step stays red: a twice-reproduced stall is a real problem, not a flake."
          elif [ "$final_rc" -eq 1 ]; then
            echo "::error::one or more boot-carrier scenarios FAILED (product red) — the verdicts above are authoritative"
          fi
          exit "$final_rc"

      # The M2 gateway-binding E2E is UI-driven — permission alert, Files
      # picker, approval dialog, notification banner (see
      # test/e2e/run-ios.sh, which drives it with WebDriverAgent/idb). Hosted
      # runners have no UI driver, so that leg CANNOT run here, and it used to
      # sit in this file as a step that warned and exited non-zero on every
      # run under continue-on-error: a failure that could never pass, absorbed
      # on every green run, which is how a pipeline teaches people to ignore
      # red. A check that cannot run is not a check, so it is not here. The
      # m2 E2E runs locally via test/e2e/run-ios.sh and its committed
      # evidence is what the matrix cites.
      #
      # What gates in this workflow: the build, and (below) the boot-carrier scenarios —
      # which are log-driven and DO run on a hosted simulator.


      # The capability plane's BLE face (mock radio): headless launch +
      # log-verify — no UI driver needed, so this CAN run on a hosted
      # runner. Same best-effort posture as the stage above: the build is
      # the hard gate; a runner without a bootable simulator reports, not
      # hides.
      - name: Run the BLE mock-radio leg on simulator and verify (logs only)
        if: steps.dsh-run.outcome == 'success' || steps.dsh-run.outcome == 'failure'
        run: sh test/e2e/run-ios-ble.sh --mode mock --skip-build
        continue-on-error: true
      - name: Report verdict
        if: always()
        run: |
          # A verdict is only reported when THIS RUN produced it. Every one of
          # these paths is also a committed file, so `cat` alone cannot tell
          # today's result from a stale committed one — and it printed a
          # committed 9/9 PASS for a run that exited before its checkers ran.
          # check.mjs stamps runId when it runs under CI; a verdict without this
          # run's id is reported as ABSENT, which is the truth.
          reported=0
          for f in \
            hosts/ios/artifacts/boot-carrier-dsh/verdict.json \
            hosts/ios/artifacts/boot-carrier-carrier/verdict.json \
            hosts/ios/artifacts/gateway/verdict.json \
            hosts/ios/artifacts/gateway/verdict-audit.json; do
            name="$(basename "$f")"
            if [ ! -f "$f" ]; then
              echo "$(dirname "$f" | xargs basename)/$name: no verdict file" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            rid=$(sed -n 's/.*"runId": *"\([^"]*\)".*/\1/p' "$f" | head -1)
            if [ -z "$rid" ]; then
              echo "$(dirname "$f" | xargs basename)/$name: NO PROVENANCE — not produced by a CI run (a committed file?)" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if [ "$rid" != "$GITHUB_RUN_ID" ]; then
              echo "$(dirname "$f" | xargs basename)/$name: STALE — produced by run $rid, not this one" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            tee -a "$GITHUB_STEP_SUMMARY" < "$f"
            reported=$((reported + 1))
          done
          # The #515 environment receipts — WHY a red is an environment red,
          # written by classify.mjs inside the attempt that earned it. The
          # canonical dirs carry the FINAL attempt's classification; the
          # .attempt1 dirs carry a retried attempt's (the flake's evidence).
          for f in \
            hosts/ios/artifacts/boot-carrier-dsh/verdict-environment.json \
            hosts/ios/artifacts/boot-carrier-dsh.attempt1/verdict-environment.json; do
            if [ -f "$f" ]; then
              echo "" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "environment receipt — $f:" | tee -a "$GITHUB_STEP_SUMMARY"
              tee -a "$GITHUB_STEP_SUMMARY" < "$f"
            fi
          done
          echo "" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "verdicts produced by THIS run: $reported" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-carrier-dsh-ios
          path: |
            hosts/ios/artifacts/boot-carrier-dsh/
            hosts/ios/artifacts/boot-carrier-carrier/
            # A retried attempt-1 keeps its verdicts + environment receipt
            # under these — the flake's evidence rides the same artifact.
            hosts/ios/artifacts/boot-carrier-dsh.attempt1/
            hosts/ios/artifacts/boot-carrier-carrier.attempt1/
            hosts/ios/artifacts/gateway/
            # The JUnit XMLs rode along inside the dirs above already; naming
            # them keeps the annotation contract explicit rather than incidental.
            hosts/ios/artifacts/boot-carrier-dsh/verdict.xml
            hosts/ios/artifacts/boot-carrier-carrier/verdict.xml
          if-no-files-found: warn
